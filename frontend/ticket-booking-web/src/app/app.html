<mat-toolbar color="primary" class="app-toolbar">
  <div class="app-toolbar__inner">
    <button mat-icon-button type="button" class="app-toolbar__menu-button" aria-label="Open navigation menu"
      [matMenuTriggerFor]="appMenu">
      <mat-icon>menu</mat-icon>
    </button>

    <a mat-button routerLink="/events" class="app-toolbar__brand">
      <mat-icon>confirmation_number</mat-icon>
      <span>Ticket Booking</span>
    </a>

    <span class="app-toolbar__spacer"></span>
  </div>
</mat-toolbar>

<mat-menu #appMenu="matMenu" class="app-menu">
  @if (isAdmin()) {
  <a mat-menu-item routerLink="/admin">
    <mat-icon>admin_panel_settings</mat-icon>
    <span>Admin</span>
  </a>
  }

  @if (isAuthenticated()) {
  <a mat-menu-item routerLink="/my-orders">
    <mat-icon>receipt_long</mat-icon>
    <span>My orders</span>
  </a>
  <a mat-menu-item routerLink="/my-tickets">
    <mat-icon>confirmation_number</mat-icon>
    <span>My tickets</span>
  </a>
  @if (userName(); as name) {
  <div class="app-menu__user" translate="no">{{ name }}</div>
  }
  <button mat-menu-item type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sign out</span>
  </button>
  } @else {
  <a mat-menu-item routerLink="/register">
    <mat-icon>person_add</mat-icon>
    <span>Register</span>
  </a>
  <a mat-menu-item routerLink="/login">
    <mat-icon>login</mat-icon>
    <span>Sign in</span>
  </a>
  }
</mat-menu>

<main class="app-content">
  <router-outlet />
</main>
