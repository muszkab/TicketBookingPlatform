<section class="admin-event-create">
  <header class="admin-event-create__header">
    <a mat-icon-button routerLink="/admin/events" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <h1>Create event</h1>
  </header>

  @if (submitting()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card appearance="outlined">
    <mat-card-content>
      @if (locationsError(); as msg) {
        <div class="admin-event-create__inline-error">
          <span>{{ msg }}</span>
          <button mat-button color="primary" type="button" (click)="reloadLocations()">Retry</button>
        </div>
      }

      <app-admin-event-form
        [locations]="locations()"
        [locationsLoading]="locationsLoading()"
        [submitting]="submitting()"
        submitLabel="Create"
        (formSubmit)="onSubmit($event)"
        (cancelled)="cancel()"
      />

      @if (formError(); as msg) {
        <p class="admin-event-create__form-error">{{ msg }}</p>
      }
    </mat-card-content>
  </mat-card>
</section>
