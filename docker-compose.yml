services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: tbp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db/backup:/var/opt/mssql/backup:ro
    networks:
      - app-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: src/Migrator/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    container_name: tbp-migrator
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-TicketBookingPlatform};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD}
      Migrator__SeedDemoData: "true"
      Logging__LogLevel__Default: Information
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - app-net
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    container_name: tbp-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DATABASE:-TicketBookingPlatform};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__SigningKey: ${JWT_SIGNING_KEY}
      OpenApi__Enabled: "true"
      ForwardedHeaders__Enabled: "true"
      Https__RedirectEnabled: "false"
      Https__HstsEnabled: "false"
      Logging__LogLevel__Default: Information
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  spa:
    build:
      context: ./frontend/ticket-booking-web
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: tbp-spa
    ports:
      - "${SPA_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: tbp-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${ASPIRE_DASHBOARD_OTLP_PORT:-18889}:18889"
    networks:
      - app-net
    restart: unless-stopped
    profiles:
      - observability

volumes:
  mssql-data:

networks:
  app-net:
    driver: bridge
