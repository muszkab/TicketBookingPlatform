version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      dotnet-platform:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      asp-versioning:
        patterns:
          - "Asp.Versioning.*"
      azure:
        patterns:
          - "Azure.*"
      test-tooling:
        patterns:
          - "coverlet.*"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "NSubstitute"
          - "xunit*"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend/ticket-booking-web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angularx-qrcode"
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angularx-qrcode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directories:
      - "/src/WebApi"
      - "/src/Migrator"
      - "/frontend/ticket-booking-web"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
