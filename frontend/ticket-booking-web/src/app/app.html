<mat-toolbar color="primary" class="app-toolbar">
  <div class="app-toolbar__inner">
    <a mat-button routerLink="/events" class="app-toolbar__brand">
      <mat-icon>confirmation_number</mat-icon>
      <span>Ticket Booking</span>
    </a>

    <span class="app-toolbar__spacer"></span>

    @if (isAdmin()) {
      <a mat-button routerLink="/admin">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Admin</span>
      </a>
    }

    @if (isAuthenticated()) {
      <a mat-button routerLink="/my-orders">
        <mat-icon>receipt_long</mat-icon>
        <span>My orders</span>
      </a>
      <a mat-button routerLink="/my-tickets">
        <mat-icon>confirmation_number</mat-icon>
        <span>My tickets</span>
      </a>
      @if (userName(); as name) {
        <span class="app-toolbar__user">{{ name }}</span>
      }
      <button mat-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    } @else {
      <a mat-button routerLink="/login">
        <mat-icon>login</mat-icon>
        <span>Sign in</span>
      </a>
    }
  </div>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
