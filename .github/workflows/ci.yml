name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TicketBookingPlatform.slnx

      - name: Build
        run: dotnet build TicketBookingPlatform.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test TicketBookingPlatform.slnx --no-build -c Release
          --logger "trx"
          --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test results
          path: "TestResults/*.trx"
          reporter: dotnet-trx

  openapi-drift-check:
    name: OpenAPI drift check
    # Temporarily disabled: needs further stabilization in CI (see Roadmap_CiCd.md, 3.2).
    if: false
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://localhost:5057
      OpenApi__Enabled: "true"
      Https__RedirectEnabled: "false"
      Https__HstsEnabled: "false"
      Database__MigrateOnStartup: "false"
      Database__SeedOnStartup: "false"
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=TicketBookingPlatform;Trusted_Connection=True;TrustServerCertificate=True"
      JwtSettings__Issuer: "ticket-booking-ci"
      JwtSettings__Audience: "ticket-booking-ci-client"
      JwtSettings__SigningKey: "ci-openapi-drift-check-signing-key-which-is-long-enough-0123456789"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore TicketBookingPlatform.slnx

      - name: Build WebApi
        run: dotnet build src/WebApi/WebApi.csproj --no-restore -c Release

      - name: Start WebApi in background
        run: |
          nohup dotnet run --project src/WebApi/WebApi.csproj --no-build -c Release --no-launch-profile \
            > webapi.log 2>&1 &
          echo $! > webapi.pid

      - name: Wait for WebApi to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl --fail -s -o /dev/null "$ASPNETCORE_URLS/health"; then
              echo "WebApi is up."
              exit 0
            fi
            echo "Waiting for WebApi... ($i)"
            sleep 2
          done
          echo "WebApi did not become healthy in time." >&2
          cat webapi.log
          exit 1

      - name: Fetch actual OpenAPI spec
        run: curl --fail -s "$ASPNETCORE_URLS/openapi/v1.json" -o /tmp/v1.actual.json

      - name: Compare against committed spec
        run: |
          jq -S . frontend/ticket-booking-web/openapi/v1.json > /tmp/v1.expected.sorted.json
          jq -S . /tmp/v1.actual.json > /tmp/v1.actual.sorted.json

          if ! diff -u /tmp/v1.expected.sorted.json /tmp/v1.actual.sorted.json; then
            echo "::error::The committed OpenAPI spec (frontend/ticket-booking-web/openapi/v1.json) is out of date. Run 'npm run refresh:api' in frontend/ticket-booking-web and commit the result."
            exit 1
          fi

      - name: Stop WebApi
        if: always()
        run: kill "$(cat webapi.pid)" 2>/dev/null || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ticket-booking-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/ticket-booking-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish-images:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image owner (lowercase)
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/ticket-booking-platform-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/WebApi/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for SPA image
        id: meta-spa
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lowercase }}/ticket-booking-platform-spa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push SPA image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/ticket-booking-web
          push: true
          tags: ${{ steps.meta-spa.outputs.tags }}
          labels: ${{ steps.meta-spa.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test-images:
    name: Smoke-test published images
    runs-on: ubuntu-latest
    needs: publish-images
    env:
      MSSQL_SA_PASSWORD: Smoke_Test_Strong#Pass1
      MSSQL_DATABASE: TicketBookingPlatform
      JWT_SIGNING_KEY: ci-smoke-test-signing-key-which-is-long-enough-0123456789
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Smoke_Test_Admin#Pass1
      API_PORT: 8080
      SPA_PORT: 4200

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image owner (lowercase)
        id: owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Determine image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Start stack from the published images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.publishedimage.yml up -d

      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            if curl --fail -s -o /dev/null http://localhost:8080/health; then
              echo "API is up."
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 5
          done
          echo "API did not become healthy in time." >&2
          docker compose -f docker-compose.yml -f docker-compose.publishedimage.yml logs
          exit 1

      - name: Wait for SPA health check
        run: |
          for i in $(seq 1 15); do
            if curl --fail -s -o /dev/null http://localhost:4200/; then
              echo "SPA is up."
              exit 0
            fi
            echo "Waiting for SPA... ($i)"
            sleep 4
          done
          echo "SPA did not become healthy in time." >&2
          docker compose -f docker-compose.yml -f docker-compose.publishedimage.yml logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.publishedimage.yml down -v
